analytics_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      port: "{{ env_var('NEON_PORT', '5432') | int }}"
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      dbname: "{{ env_var('NEON_DBNAME') }}"
      schema: public
      sslmode: require
      threads: 4
